<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Card and pickup example</title><desc id="desc">A violet card reveal beside a board with wall, action, and fortune pickups.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#284773"/><path d="M40 0H0V40" fill="none" stroke="#86a6d0" stroke-opacity=".24"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="720" height="420" rx="24" fill="#0d1528"/><rect x="30" y="30" width="360" height="360" rx="12" fill="url(#grid)"/>
  <g font-family="system-ui" font-weight="900" font-size="19" text-anchor="middle" filter="url(#glow)"><circle cx="110" cy="210" r="22" fill="#101a32" stroke="#ffe066" stroke-width="4"/><text x="110" y="217" fill="#ffe066">W</text><circle cx="270" cy="170" r="22" fill="#101a32" stroke="#7ac2ff" stroke-width="4"/><text x="270" y="177" fill="#7ac2ff">+</text><circle cx="190" cy="250" r="22" fill="#101a32" stroke="#c69cff" stroke-width="4"/><text x="190" y="257" fill="#c69cff">?</text></g>
  <rect x="425" y="72" width="245" height="276" rx="18" fill="#4c2b76" stroke="#d7adff" stroke-width="3" filter="url(#glow)"/><text x="548" y="120" fill="#e9d1ff" font-family="system-ui" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="3">CARD DRAWN</text><text x="548" y="205" fill="#fff" font-family="system-ui" font-size="34" font-weight="900" text-anchor="middle">+2 MOVES</text><text x="548" y="255" fill="#f2e8ff" font-family="system-ui" font-size="17" text-anchor="middle">Cards activate</text><text x="548" y="280" fill="#f2e8ff" font-family="system-ui" font-size="17" text-anchor="middle">immediately.</text>
</svg>
