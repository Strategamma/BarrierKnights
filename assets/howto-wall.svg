<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Wall action example</title><desc id="desc">A nine by nine board showing an amber two-space wall preview between squares.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#284773"/><path d="M40 0H0V40" fill="none" stroke="#86a6d0" stroke-opacity=".24"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="720" height="420" rx="24" fill="#0d1528"/><rect x="30" y="30" width="360" height="360" rx="12" fill="url(#grid)"/>
  <circle cx="210" cy="370" r="15" fill="#7ac2ff" stroke="#101a32" stroke-width="4"/><circle cx="210" cy="50" r="15" fill="#ffe066" stroke="#101a32" stroke-width="4"/>
  <path d="M115 190H185" stroke="#ffc45c" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/><path d="M235 230V300" stroke="#7ac2ff" stroke-width="13" stroke-linecap="round" opacity=".8"/>
  <text x="430" y="105" fill="#ffb84d" font-family="system-ui" font-size="18" font-weight="800" letter-spacing="3">WALL</text><text x="430" y="155" fill="#fff7ec" font-family="system-ui" font-size="30" font-weight="800">Block a route,</text><text x="430" y="192" fill="#fff7ec" font-family="system-ui" font-size="30" font-weight="800">not every route.</text><text x="430" y="250" fill="#cbd6ea" font-family="system-ui" font-size="18">Walls span two edges. Both</text><text x="430" y="278" fill="#cbd6ea" font-family="system-ui" font-size="18">knights must keep a path.</text>
</svg>
